# Omarchy on Ubuntu: start the speaker tuning only in the Hyprland (Omarchy) session.
# graphical-session.target is also reached in GNOME, which doesn't set OMARCHY_PATH.
# The condition is checked when the unit starts, so order it after uwsm's environment preloader
# (wayland-wm-env@, Before=graphical-session-pre.target); otherwise it races the import and is skipped.
[Unit]
After=graphical-session-pre.target
ConditionEnvironment=OMARCHY_PATH
